<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Poker</title>
<meta name="game-version" content="2026-11-11.1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22 shape-rendering=%22crispEdges%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%231d140e%22/%3E%3Cpath d=%22M16 3 28 9.5 16 16 4 9.5Z%22 fill=%22%23ffc61a%22/%3E%3Cpath d=%22M4 9.5 16 16V29L4 22.5Z%22 fill=%22%23b9784a%22/%3E%3Cpath d=%22M28 9.5 16 16V29L28 22.5Z%22 fill=%22%237a4a2a%22/%3E%3Cpath d=%22M16 3 28 9.5 16 16 4 9.5Z%22 fill=%22none%22 stroke=%22%231d140e%22 stroke-width=%221%22/%3E%3Cpath d=%22M4 9.5 16 16 28 9.5M16 16V29M4 9.5V22.5L16 29 28 22.5V9.5L16 3Z%22 fill=%22none%22 stroke=%22%231d140e%22 stroke-width=%221.5%22 stroke-linejoin=%22round%22/%3E%3Crect x=%2213%22 y=%228%22 width=%226%22 height=%223%22 fill=%22%23fff3a8%22/%3E%3Crect x=%228%22 y=%2217%22 width=%224%22 height=%224%22 fill=%22%232ecc71%22/%3E%3Crect x=%2220%22 y=%2218%22 width=%224%22 height=%224%22 fill=%22%234ad0ff%22/%3E%3C/svg%3E">
<style>
  :root{
    color-scheme:dark;
    --bg:#15100c; --panel:#241a13; --panel2:#33261b; --edge:#0b0705; --line:#4a3827;
    --text:#f6ecda; --muted:#b8a68c;
    --gold:#ffcf4a; --chips:#4a9bff; --mult:#ff5147; --ok:#63d44b; --bad:#ff6a5c; --emerald:#2fe07a;
    --r-common:#a9aeb4; --r-uncommon:#63d44b; --r-rare:#4a9bff; --r-legendary:#ffc61a;
    --avail:calc(100vw - 32px);
    --hn:8;
    --cw:clamp(34px, min(calc((min(var(--avail), 800px) - 70px) / var(--hn)), calc((100vh - 430px) / 2.8)), 88px);
  }
  @media (min-width:940px){ :root{ --avail:calc(100vw - 280px - 64px); } }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{
    min-height:100vh; color:var(--text);
    font:700 16px/1.35 Consolas,Menlo,"Courier New",monospace;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,190,80,.16), transparent 55%),
      repeating-conic-gradient(#1a130e 0% 25%, #17100b 0% 50%) 0 0 / 32px 32px;
    background-color:var(--bg);
  }
  button{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .muted{color:var(--muted);font-weight:400}

  /* ---------- Buttons ---------- */
  .btn{
    cursor:pointer; padding:10px 16px; min-height:44px;
    background:#5a4632; border:3px solid var(--edge);
    box-shadow:inset -4px -4px 0 rgba(0,0,0,.35), inset 4px 4px 0 rgba(255,255,255,.22);
    letter-spacing:.02em;
  }
  .btn:hover:not(:disabled){background:#6b543c}
  .btn:active:not(:disabled){transform:translateY(2px)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.go{background:#2f8f3f}.btn.go:hover:not(:disabled){background:#38a84b}
  .btn.warn{background:#9a3a2d}.btn.warn:hover:not(:disabled){background:#b5463a}
  .btn.gold{background:#b8891a;color:#fff7dc}.btn.gold:hover:not(:disabled){background:#d29f23}
  .btn.on{background:#b8891a;color:#fff7dc}
  .btn.small{min-height:36px;padding:6px 10px;font-size:14px}

  /* ---------- Title ---------- */
  .screen{min-height:100vh}
  #title{display:grid;place-items:center;padding:24px 16px}
  .tbox{max-width:560px;width:100%;text-align:center}
  .logo{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
  .logo svg{width:46px;height:46px;image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5))}
  .logo svg:nth-child(odd){transform:translateY(6px)}
  .tbox h1{margin:0 0 6px;font-size:clamp(34px,9vw,60px);letter-spacing:.04em;line-height:1;
    text-shadow:0 5px 0 #000, 0 0 30px rgba(255,190,80,.35)}
  .tbox .sub{margin:0 0 22px;color:var(--muted);font-weight:400}
  .tlist{list-style:none;margin:0 auto 22px;padding:14px 16px;text-align:left;max-width:460px;
    background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 3px var(--line)}
  .tlist li{padding:4px 0;font-weight:400}
  .tlist b{color:var(--gold)}
  .tbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .record{margin-top:16px;color:var(--muted);font-weight:400;min-height:1.4em}

  /* ---------- Top bar ---------- */
  .hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 16px;
    background:rgba(11,7,5,.7);border-bottom:3px solid var(--edge);position:sticky;top:0;z-index:20;backdrop-filter:blur(4px)}
  .brand{font-size:18px;letter-spacing:.06em;margin-right:auto}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--line)}
  .pill svg{width:18px;height:18px;image-rendering:pixelated}
  .pill.money{color:var(--emerald)}
  .hud-btns{display:flex;gap:6px;flex-wrap:wrap}

  /* ---------- Layout ---------- */
  .layout{display:grid;grid-template-columns:1fr;gap:14px;max-width:1180px;margin:0 auto;padding:10px 16px 24px}
  @media (min-width:940px){ .layout{grid-template-columns:280px 1fr;align-items:start} .side{position:sticky;top:70px} }
  .box{background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 3px var(--line);padding:12px 14px;margin-bottom:12px}
  .side .lbl{color:var(--muted);font-weight:400;font-size:14px}
  .rname{font-size:20px;margin:2px 0 8px}
  .scorebig{font-size:34px;color:var(--gold);line-height:1;margin:6px 0}
  .scorebig small{font-size:15px;color:var(--muted);font-weight:400}
  .bar{height:12px;background:#0f0a07;border:2px solid var(--edge);margin-top:8px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb52e,#ffe27a)}
  .calc .cname{min-height:1.4em;margin-bottom:6px}
  .calc .crow{display:flex;align-items:stretch;gap:8px;font-size:26px}
  .calc .clab{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;font-size:10px;font-weight:400;color:var(--muted);margin-top:2px;line-height:1.1}
  .calc .clab span{text-align:center;min-width:0;overflow:hidden}
  .calc .clab .x{visibility:hidden;font-size:26px;height:0}
  .cc,.cm{flex:1;text-align:center;padding:8px 4px;border:3px solid var(--edge);color:#fff;min-width:0}
  .cc{background:#2c63b8}.cm{background:#b8362d}
  .crow .x{align-self:center;color:var(--muted)}
  .bump{animation:bump .22s}
  @keyframes bump{50%{transform:scale(1.18)}}
  .ctotal{min-height:1.5em;margin-top:8px;text-align:center;font-size:22px;color:var(--gold)}
  .counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .counters.two{grid-template-columns:1fr 1fr}
  .cnt b{display:block;font-size:30px;line-height:1.1}
  .cnt.h b{color:var(--chips)}.cnt.d b{color:var(--mult)}.cnt.k b{color:var(--muted)}
  .cnt span{color:var(--muted);font-weight:400;font-size:14px}

  .bossbar{background:#3a1713;border:3px solid #7d241b;padding:10px 14px;margin-bottom:12px}

  /* ---------- Jokers ---------- */
  .jwrap{position:relative;margin-bottom:6px}
  .jokers{display:flex;gap:6px;align-items:center;margin-bottom:0}
  .jslot{position:relative;flex:1 1 0;max-width:118px;height:66px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:var(--panel2);border:3px solid var(--edge);border-bottom:5px solid var(--rc,var(--edge));box-shadow:inset 0 0 0 3px var(--line);cursor:grab;padding:2px;touch-action:none;user-select:none;-webkit-user-select:none}
  .jslot.empty{cursor:default;opacity:.45;font-size:24px;color:var(--muted);border-style:dashed;border-bottom-style:dashed}
  .jslot.sel{box-shadow:inset 0 0 0 3px var(--gold);transform:translateY(-6px)}
  .je{font-size:clamp(20px,2.4vw,28px);line-height:1;pointer-events:none}
  .jn{font-size:clamp(9px,1vw,12px);line-height:1.1;text-align:center;font-weight:400;overflow:hidden;max-width:100%;white-space:nowrap;text-overflow:ellipsis;pointer-events:none}
  .jcount{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:400;font-size:14px;white-space:nowrap}
  .jinfo{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:15;padding:6px 10px;background:#1d140e;border:3px solid var(--gold);box-shadow:0 8px 0 rgba(0,0,0,.45);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:400;font-size:14px}
  .jinfo b{font-weight:700}
  .jacts{display:flex;gap:6px}
  .jslot.dragging{z-index:30;opacity:.92;cursor:grabbing;box-shadow:0 10px 0 rgba(0,0,0,.45), inset 0 0 0 3px var(--gold);transition:none}
  .jslot.dropt{outline:3px dashed var(--gold);outline-offset:2px}
  .r-common{--rc:var(--r-common)}.r-uncommon{--rc:var(--r-uncommon)}.r-rare{--rc:var(--r-rare)}.r-legendary{--rc:var(--r-legendary)}
  .r-book{--rc:#b9784a}.r-grand{--rc:#d2493a}
  .offer{position:relative}
  .offer .rib{position:absolute;top:4px;right:6px;font-size:10px;letter-spacing:.5px;color:var(--rc)}
  .offer.r-rare{box-shadow:inset 0 0 0 3px var(--line),0 0 9px rgba(80,160,255,.35)}
  .offer.r-legendary{overflow:hidden;animation:lglow 2.4s ease-in-out infinite}
  .offer.r-legendary::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,240,170,.4),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite;pointer-events:none}
  @keyframes shine{0%,55%{left:-60%}100%{left:140%}}
  @keyframes lglow{50%{box-shadow:inset 0 0 0 3px var(--line),0 0 20px rgba(255,198,26,.65)}}
  .jslot.pop{animation:popin .7s ease-out}
  @keyframes popin{0%{transform:scale(1.35);filter:brightness(2)}100%{transform:scale(1);filter:none}}
  body.flash::after{content:'';position:fixed;inset:0;z-index:60;pointer-events:none;background:radial-gradient(circle,rgba(255,220,90,.4),transparent 65%);animation:flashA .8s ease-out forwards}
  @keyframes flashA{from{opacity:1}to{opacity:0}}
  .picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 4px}
  .pick{font:inherit;color:inherit;cursor:pointer;text-align:center}
  .pick:hover,.pick:focus-visible{transform:translateY(-2px);outline:3px solid var(--gold)}
  @media (prefers-reduced-motion:reduce){.offer.r-legendary,.offer.r-legendary::after,.jslot.pop,body.flash::after{animation:none}}
  .offer.r-legendary,.jtile.r-legendary{box-shadow:inset 0 0 0 3px var(--line),0 0 12px rgba(255,198,26,.38)}
  .jslot.r-legendary:not(.sel):not(.dragging){box-shadow:inset 0 0 0 3px var(--line),0 0 10px rgba(255,198,26,.45)}
  .jtile.r-legendary .jt-badge{background:linear-gradient(135deg,#fff3a8,#ffc61a 55%,#c98a00)}
  .offer.r-legendary .ot{color:#ffd34d}
  .info{display:inline-grid;place-items:center;width:22px;height:22px;padding:0;border-radius:50%;cursor:pointer;flex:0 0 auto;
    font:700 13px/1 Georgia,serif;font-style:italic;color:var(--muted);background:transparent;border:2px solid var(--muted)}
  .info:hover{color:var(--gold);border-color:var(--gold)}
  .box .info.corner{position:absolute;top:8px;right:8px}
  .side .box{position:relative}

  /* ---------- Cards ---------- */
  .card{
    position:relative;width:var(--cw);height:calc(var(--cw)*1.4);flex:0 0 auto;padding:0;cursor:pointer;color:#2a1d12;
    border:3px solid var(--edge);background:var(--cbg,#eee);
    box-shadow:inset -3px -3px 0 rgba(0,0,0,.18), inset 3px 3px 0 rgba(255,255,255,.55), 0 4px 0 rgba(0,0,0,.45);
    transition:transform .12s ease;
  }
  div.card{cursor:default}
  .card .cv{position:absolute;top:3px;left:3px;font-size:calc(var(--cw)*.24);line-height:1;padding:2px 3px;background:#2c63b8;color:#fff;border:2px solid var(--edge)}
  .card .ic{position:absolute;inset:0;display:grid;place-items:center;padding-top:calc(var(--cw)*.12)}
  .card .ic svg{width:calc(var(--cw)*.6);height:calc(var(--cw)*.6);image-rendering:pixelated}
  .card .cn{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:calc(var(--cw)*.17);font-weight:700;line-height:1}
  .m-holz{--cbg:#f1dcb6}.m-stock{--cbg:#ecd7b6}.m-stein{--cbg:#e4e7ea}.m-eisen{--cbg:#eceae8}.m-gold{--cbg:#fbf0bd}.m-diamant{--cbg:#d3f7f9}
  button.card:hover{transform:translateY(-5px)}
  .card.sel{transform:translateY(-18px)!important;outline:3px solid var(--gold);outline-offset:0}
  .card.deb{filter:grayscale(1) brightness(.72)}
  .card .x{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.7);color:rgba(200,30,20,.85);text-shadow:0 2px 0 #000}
  .score{animation:pop .35s}
  @keyframes pop{50%{transform:translateY(-12px) scale(1.12)}}
  .float{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-weight:900;font-size:15px;padding:2px 6px;border:2px solid var(--edge);pointer-events:none;white-space:nowrap;z-index:6;animation:floatUp .9s ease-out forwards;color:#fff}
  .float.c{background:#2c63b8}.float.m{background:#b8362d}.float.x{background:#8a3fd0}.float.d{background:#555}
  @keyframes floatUp{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-38px}}

  /* ---------- Workbench ---------- */
  .bench{display:flex;align-items:center;justify-content:center;gap:clamp(3px,1vw,8px);padding:8px;margin-bottom:2px;
    background:linear-gradient(#3b2a1a,#2e2014);border:3px solid var(--edge);box-shadow:inset 0 0 0 3px #5a4029}
  .slot{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);flex:0 0 auto;background:rgba(0,0,0,.35);border:3px solid #120c08;box-shadow:inset 3px 3px 0 rgba(0,0,0,.45), inset -2px -2px 0 rgba(255,255,255,.08);display:grid;place-items:center}
  .slot .card{position:absolute;inset:-3px;width:auto;height:auto}
  .slot .ghost svg{width:calc(var(--cw)*.5);height:calc(var(--cw)*.5);opacity:.55;image-rendering:pixelated}
  .arrow{font-size:calc(var(--cw)*.5);color:var(--muted);flex:0 0 auto}
  .slot.result{border-color:var(--gold);flex-direction:column;gap:2px;padding:2px;text-align:center}
  .slot.result .re{font-size:calc(var(--cw)*.5);line-height:1}
  .slot.result .rn{font-size:calc(var(--cw)*.15);line-height:1.1;font-weight:700;word-break:break-word}
  .hand{display:flex;justify-content:center;gap:clamp(3px,.9vw,8px);padding:22px 0 4px;min-height:calc(var(--cw)*1.4 + 26px)}
  .controls{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:6px}
  .sortg{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:400;font-size:14px}
  .btn.ic.off{opacity:.45;text-decoration:line-through}
  .btn.ic{min-width:40px;padding:6px 9px;font-size:16px;line-height:1}

  /* ---------- Market ---------- */
  .shop h2{margin:0 0 2px;font-size:20px;display:flex;align-items:center;gap:8px}
  .offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
  .offer{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:8px;background:var(--panel2);border:3px solid var(--edge);border-top:5px solid var(--rc,var(--edge));box-shadow:inset 0 0 0 3px var(--line)}
  .offer .oe{font-size:32px;line-height:1}
  .offer .od{font-weight:400;font-size:13px;flex:1}
  .offer .ot{font-weight:400;font-size:11px;color:var(--muted)}
  .offer.sold{opacity:.35;justify-content:center;min-height:120px}
  .books{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0 0 10px}
  .book{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 8px;background:var(--panel2);border:3px solid var(--edge);border-left:5px solid var(--rc,var(--edge));box-shadow:inset 0 0 0 3px var(--line)}
  .book .be{font-size:28px;line-height:1}
  .book .bt{flex:1 1 110px;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:13px;line-height:1.2}
  .book .bt .ot,.book .bt .bd{font-weight:400;font-size:12px;color:var(--muted)}
  .book .bt .bd{color:var(--text)}
  .book.sold{opacity:.35;justify-content:center;min-height:60px}
  .shopbtns{align-items:center}
  .shopbtns .nextinfo{margin-left:auto;font-size:14px}
  .btn.reroll{display:inline-flex;align-items:center;gap:8px;padding:8px 12px}
  .btn.reroll svg.rr{width:22px;height:22px}
  .btn.reroll .rc{display:inline-flex;align-items:center;gap:4px;color:var(--emerald)}
  .btn.reroll .rc svg{width:16px;height:16px;image-rendering:pixelated}
  .btn.poor{opacity:.5}
  .shopbtns{display:flex;gap:10px;flex-wrap:wrap}

  /* ---------- Dialogs ---------- */
  .modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.72);overflow:auto}
  .mpanel{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;background:var(--panel);border:4px solid var(--edge);box-shadow:inset 0 0 0 3px var(--line)}
  .mpanel.wide{width:min(1060px,100%)}
  .coach{margin-top:12px;padding:12px 14px;background:var(--panel2);border:4px solid var(--gold);box-shadow:inset 0 0 0 3px var(--edge),0 0 0 3px var(--edge)}
  .coach .ct{font-size:17px;color:var(--gold);margin-bottom:4px}
  .coach p{margin:0 0 10px;font-weight:400;font-size:15px}
  .coach .cb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .coach .cs{margin-left:auto}
  .card.tuthi:not(.sel){outline:4px solid var(--gold);outline-offset:2px;animation:tutpulse 1s infinite alternate}
  @keyframes tutpulse{from{box-shadow:0 0 0 0 rgba(255,207,74,0)}to{box-shadow:0 0 14px 4px rgba(255,207,74,.8)}}
  .diffsel{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
  .diffinfo{margin:0 0 10px;text-align:center;min-height:1.4em}
  .mclose{position:sticky;top:0;float:right;z-index:2;width:36px;height:36px;min-height:0;padding:0;margin:-6px -6px 0 8px;font-size:22px;line-height:1;display:grid;place-items:center}
  .mpanel h2{margin:0 0 10px;font-size:24px}
  .mpanel p,.mpanel li{font-weight:400}
  .mpanel ul{padding-left:20px;margin:8px 0 14px}
  .mpanel .note{margin:8px 0;padding:8px 10px;background:rgba(0,0,0,.25);border:3px solid var(--edge)}
  .mpanel .mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  table.rec{width:100%;border-collapse:collapse;font-weight:400;font-size:14px}
  table.rec td,table.rec th{padding:5px 6px;border-bottom:2px solid var(--line);text-align:left}
  table.rec td.n{text-align:right;white-space:nowrap}
  .lines{list-style:none;padding:0!important}
  .lines li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:2px solid var(--line)}
  .lines li.sum{border:0;color:var(--emerald);font-weight:700;font-size:18px}
  .colbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
  .colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .jtile{display:flex;flex-direction:column;gap:4px;padding:8px 10px;background:var(--panel2);border:3px solid var(--edge);border-top:5px solid var(--rc,#888);box-shadow:inset 0 0 0 3px var(--line)}
  .jtile .jt-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .jtile .jt-e{font-size:30px;line-height:1}
  .jtile .jt-badge{font-size:11px;padding:1px 6px;border:2px solid var(--edge);background:var(--rc,#888);color:#111}
  .jtile .jt-d{font-weight:400;font-size:13px;flex:1}
  .jtile .jt-m{font-weight:400;font-size:12px;color:var(--muted)}
  .jtile.found .jt-m b{color:var(--ok)}

<script>
(function(){
'use strict';

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, r) => (r || document).querySelector(s);
const params = new URLSearchParams(location.search);
const TEST = params.has('test');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng = params.has('seed') ? mulberry32(parseInt(params.get('seed'),10)||1) : Math.random;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
function fmt(x){ return Number.isInteger(x) ? String(x) : String(+x.toFixed(2)); }
function num(n){ return n.toLocaleString('en-US'); }

/* =====================================================================
   Pixel art (hand-drawn, 8x8)
   ===================================================================== */
const PIX = {
  holz:{pal:{W:'#c9964f',w:'#9a6a30',x:'#6e4a1f'},map:[
    'WWWWWWWW','WwWWWWwW','xxxxxxxx','WWWWwWWW','WWwWWWWW','xxxxxxxx','WWWWWWWW','WwWWWwWW']},
  stock:{pal:{S:'#c58a3f',x:'#6b4420'},map:[
    '.....xSS','....xSSx','...xSSx.','..xSSx..','.xSSx...','xSSx....','SSx.....','Sx......']},
  stein:{pal:{a:'#a9aeb4',b:'#7d838a',c:'#565b61'},map:[
    'abbaaabb','bcabbaca','aabaacab','bbacbaaa','acaabbca','abbacaab','bcaabbac','aabcaaba']},
  eisen:{pal:{o:'#4b4b52',i:'#ffffff',I:'#d9d9de',g:'#9a9aa3'},map:[
    '........','..oooooo','.oiIIIIo','oiIIIIgo','oIIIIggo','oggggoo.','.oooo...','........']},
  gold:{pal:{o:'#7a5410',i:'#fff1a6',I:'#f6c72c',g:'#c18a12'},map:[
    '........','..oooooo','.oiIIIIo','oiIIIIgo','oIIIIggo','oggggoo.','.oooo...','........']},
  diamant:{pal:{k:'#16929c',C:'#43e6ee',w:'#eaffff'},map:[
    '..kkkk..','.kCCCCk.','kCwwCCCk','kCwCCCCk','.kCCCCk.','..kCCk..','...kk...','........']},
  smaragd:{pal:{k:'#12853f',C:'#2fe07a',w:'#d8ffe6'},map:[
    '..kkkk..','.kCCCCk.','kCwwCCCk','kCwCCCCk','.kCCCCk.','..kCCk..','...kk...','........']}
};
const iconCache = {};
function icon(name){
  if(iconCache[name]) return iconCache[name];
  const p = PIX[name]; let r='';
  for(let y=0;y<8;y++) for(let x=0;x<8;x++){
    const ch=p.map[y][x]; if(ch==='.') continue;
    r += '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+p.pal[ch]+'"/>';
  }
  return iconCache[name] = '<svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">'+r+'</svg>';
}

/* =====================================================================
   Game data
   (internal material ids stay as they are; only the displayed names are English)
   ===================================================================== */
const MATS = {
  holz:   {name:'Wood',    chips:2},
  stock:  {name:'Stick',   chips:3},
  stein:  {name:'Stone',   chips:5},
  eisen:  {name:'Iron',    chips:8},
  gold:   {name:'Gold',    chips:11},
  diamant:{name:'Diamond', chips:15}
};
const MAT_ORDER = ['holz','stock','stein','eisen','gold','diamant'];
const COPIES = {holz:9, stock:8, stein:9, eisen:8, gold:8, diamant:6};   // 48 cards, Diamonds are the rarest
const HAND_SIZE = 8;
const MAX_SEL = 5;
const MAX_JOKERS = 5;

const HANDS = {
  high:        {name:'Raw Material',   emoji:'🪨', chips:5,  mult:1, lc:10, lm:1, info:'Any single card (the most valuable one scores)'},
  pair:        {name:'Stack',          emoji:'📦', chips:10, mult:2, lc:15, lm:1, info:'2 of the same material'},
  twopair:     {name:'Double Stack',   emoji:'🗃️', chips:20, mult:2, lc:20, lm:1, info:'2 + 2 of the same material'},
  three:       {name:'Ingot',          emoji:'🧱', chips:30, mult:3, lc:20, lm:2, info:'3 of the same material'},
  holzsword:   {name:'Wooden Sword',   emoji:'🗡️', chips:20, mult:3, lc:15, lm:2, info:'2 Wood + 1 Stick'},
  steinsword:  {name:'Stone Sword',    emoji:'🗡️', chips:30, mult:4, lc:20, lm:2, info:'2 Stone + 1 Stick'},
  ladder:      {name:'Ladder',         emoji:'🪜', chips:35, mult:4, lc:20, lm:2, info:'3 or more Sticks'},
  eisensword:  {name:'Iron Sword',     emoji:'🗡️', chips:40, mult:4, lc:25, lm:2, info:'2 Iron + 1 Stick'},
  house:       {name:'Workbench',      emoji:'🛠️', chips:40, mult:4, lc:25, lm:2, info:'3 + 2 of the same material'},
  goldsword:   {name:'Golden Sword',   emoji:'🗡️', chips:50, mult:5, lc:25, lm:3, info:'2 Gold + 1 Stick'},
  set:         {name:'Full Set',       emoji:'🎽', chips:50, mult:5, lc:25, lm:3, info:'1 each of Wood, Stone, Iron, Gold, Diamond'},
  four:        {name:'Block',          emoji:'🧊', chips:60, mult:7, lc:30, lm:3, info:'4 of the same material'},
  diamantsword:{name:'Diamond Sword',  emoji:'⚔️', chips:60, mult:6, lc:30, lm:3, info:'2 Diamond + 1 Stick'}
};
const HAND_ORDER = Object.keys(HANDS);

function handStats(type, lv){
  const d = HANDS[type];
  return { chips: d.chips + (lv-1)*d.lc, mult: d.mult + (lv-1)*d.lm };
}

const FULL_SET = ['holz','stein','eisen','gold','diamant'];
const SWORD_MATS = ['holz','stein','eisen','gold','diamant'];

/* Finds the best recipe for the played cards. levels: optional recipe levels. */
function evaluate(cards, levels){
  const lv = t => (levels && levels[t]) || 1;
  const by = {};
  cards.forEach(c => { (by[c.mat] = by[c.mat] || []).push(c); });
  const cnt = m => (by[m] || []).length;
  const groups = Object.values(by).sort((a,b) => b.length - a.length || b[0].chips - a[0].chips);
  const cs = groups.map(g => g.length);
  const cands = [];
  const add = (type, sc) => cands.push({type, scoring: sc});

  const best = cards.reduce((a,c) => c.chips > a.chips ? c : a, cards[0]);
  add('high', [best]);
  if(cs[0] >= 2) add('pair', groups[0].slice(0,2));
  if(cs[0] >= 2 && cs[1] >= 2) add('twopair', groups[0].slice(0,2).concat(groups[1].slice(0,2)));
  if(cs[0] >= 3) add('three', groups[0].slice(0,3));
  if(cs[0] >= 3 && cs[1] >= 2) add('house', groups[0].slice(0,3).concat(groups[1].slice(0,2)));
  if(cs[0] >= 4) add('four', groups[0].slice(0,4));
  if(cnt('stock') >= 3) add('ladder', by.stock.slice());
  if(cards.length === 5 && FULL_SET.every(m => cnt(m) === 1)) add('set', cards.slice());
  SWORD_MATS.forEach(m => {
    if(cnt(m) >= 2 && cnt('stock') >= 1) add(m + 'sword', by[m].concat([by.stock[0]]));
  });

  let pick = cands[0], pv = -1;
  cands.forEach(c => {
    const s = handStats(c.type, lv(c.type));
    const v = s.chips * s.mult;
    if(v > pv){ pv = v; pick = c; }
  });
  const scoring = cards.filter(c => pick.scoring.indexOf(c) !== -1);
  return { type: pick.type, scoring: scoring, hasPair: cs[0] >= 2 };
}

/* ---------- Jokers ----------
   tag:        chips | mult | xmult | retrigger | economy | utility
   onCard:     (card, ctx, self) -> {chips, mult, xmult} | null      (runs for every scoring pass of a card)
   onHand:     (ctx, self)       -> {chips, mult, xmult} | null      (runs once after all cards)
   retrigger:  (card, ctx, indexInScoring, scoringCount) -> number of extra passes for this card
   Bonuses:    hands, discards, slots, handSize, discount, shopSlots, freeReroll, interestCap, playMoney, endMoney,
               packOptions, bookDiscount, rerollDiscount, sellBonus   (onDiscard(self), onRoundWin(self) may return a message)
*/
const MATS_IN = (c, ...m) => m.indexOf(c.mat) !== -1;
const JOKERS = [
  /* --- classics --- */
  {id:'schwein', tag:'utility', emoji:'🐷', name:'Piglet', cost:6, desc:'+1 hand each round.', hands:1},
  {id:'kuh', tag:'utility', emoji:'🐮', name:'Cow', cost:5, desc:'+1 discard each round.', discards:1},
  {id:'zombie', tag:'chips', emoji:'🧟', name:'Zombie', cost:4, desc:'+30 Chips on every recipe.', onHand:()=>({chips:30})},
  {id:'schleim', tag:'mult', emoji:'🟢', name:'Slime', cost:4, desc:'+4 Mult on every recipe.', onHand:()=>({mult:4})},
  {id:'skelett', tag:'mult', emoji:'💀', name:'Skeleton', cost:5, desc:'+10 Mult if the hand has two of the same material.', onHand:c=>c.hasPair?{mult:10}:null},
  {id:'drache', tag:'mult', emoji:'🐉', name:'Dragon', cost:6, desc:'5 gambles per hand: 50% +40 Chips, 35% +8 Mult, 20% ×2 Mult, 25% +3 emeralds, 10% recipe +1 level.',
    onHand:(c)=>{
      const roll = (p, win, lose) => rng() < p ? win : {note:lose};
      return [roll(.5, {chips:40, note:'+40 Chips'}, 'Miss'), roll(.35, {mult:8}, 'Miss'), roll(.2, {xmult:2}, 'Miss'),
              roll(.25, {money:3, note:'+3 💎'}, 'Miss'), roll(.1, {levelUp:true, note:'Level up!'}, 'Miss')];
    }},
  {id:'hexe', tag:'xmult', emoji:'🧙', name:'Witch', cost:6, desc:'×1.5 Mult on every Sword recipe.', onHand:c=>/sword$/.test(c.type)?{xmult:1.5}:null},
  {id:'dorf', tag:'economy', emoji:'🧑‍🌾', name:'Villager', cost:5, desc:'+4 emeralds at the end of every round.', endMoney:4},
  {id:'fuchs', tag:'mult', emoji:'🦊', name:'Fox', cost:5, desc:'+3 Mult for every discard left.', onHand:c=>c.discardsLeft>0?{mult:3*c.discardsLeft}:null},
  {id:'biene', tag:'mult', emoji:'🐝', name:'Bee', cost:5, desc:'Every scoring card: +2 Mult.', onCard:()=>({mult:2})},
  {id:'waechter', tag:'xmult', emoji:'🛡️', name:'Guardian', cost:6, desc:'×2 Mult on the last hand of a round.', onHand:c=>c.handsLeft===0?{xmult:2}:null},
  {id:'holzfaeller', tag:'mult', emoji:'🪓', name:'Lumberjack', cost:4, desc:'Scoring Wood: +4 Mult.', onCard:k=>k.mat==='holz'?{mult:4}:null},
  {id:'tischler', tag:'mult', emoji:'🪚', name:'Carpenter', cost:4, desc:'Scoring Sticks: +3 Mult.', onCard:k=>k.mat==='stock'?{mult:3}:null},
  {id:'bergmann', tag:'chips', emoji:'⛏️', name:'Miner', cost:4, desc:'Scoring Stone: +30 Chips.', onCard:k=>k.mat==='stein'?{chips:30}:null},
  {id:'schmied', tag:'mult', emoji:'🔨', name:'Blacksmith', cost:5, desc:'Scoring Iron: +3 Mult and +15 Chips.', onCard:k=>k.mat==='eisen'?{mult:3,chips:15}:null},
  {id:'goldgraeber', tag:'mult', emoji:'🪙', name:'Prospector', cost:5, desc:'Scoring Gold: +5 Mult.', onCard:k=>k.mat==='gold'?{mult:5}:null},
  {id:'juwelier', tag:'mult', emoji:'💎', name:'Jeweler', cost:6, desc:'Scoring Diamond: +6 Mult.', onCard:k=>k.mat==='diamant'?{mult:6}:null},
  {id:'papagei', tag:'chips', emoji:'🦀', name:'Hermit Crab', cost:4, desc:'+40 Chips if you play only 1 card.', onHand:c=>c.cards.length===1?{chips:40}:null},
  {id:'katze', tag:'mult', emoji:'🐱', name:'Cat', cost:5, desc:'+3 Mult for every hand left.', onHand:c=>c.handsLeft>0?{mult:3*c.handsLeft}:null},
  {id:'wolf', tag:'xmult', emoji:'🐺', name:'Wolf', cost:6, desc:'×1.5 Mult if every played card scores.', onHand:c=>c.scoring.length===c.cards.length?{xmult:1.5}:null},
  {id:'baer', tag:'chips', emoji:'🐻', name:'Bear', cost:5, desc:'+15 Chips for every card played.', onHand:c=>({chips:15*c.cards.length})},
  {id:'eule', tag:'mult', emoji:'🦉', name:'Owl', cost:5, desc:'+8 Mult if you play 4 or more cards.', onHand:c=>c.cards.length>=4?{mult:8}:null},
  {id:'frosch', tag:'economy', emoji:'🐸', name:'Frog', cost:5, desc:'+1 emerald for every discard left at the end of a round.', endMoneyFn:g=>g.discardsLeft},
  {id:'haendler', tag:'economy', emoji:'🧳', name:'Traveling Merchant', cost:6, desc:'Everything in the Market costs 1 less (minimum 1).', discount:1},
  {id:'lasttier', tag:'utility', emoji:'🦙', name:'Llama', cost:7, desc:'+2 Joker slots.', slots:2},
  {id:'architekt', tag:'mult', emoji:'🏗️', name:'Architect', cost:5, desc:'+12 Mult on Workbench or Double Stack.', onHand:c=>(c.type==='house'||c.type==='twopair')?{mult:12}:null},
  {id:'kletterer', tag:'xmult', emoji:'🧗', name:'Climber', cost:5, desc:'×3 Mult on Ladder.', onHand:c=>c.type==='ladder'?{xmult:3}:null},
  {id:'sammler', tag:'mult', emoji:'🎒', name:'Collector', cost:5, desc:'+2 Mult for every recipe level you bought.', onHand:c=>c.bookLevels>0?{mult:2*c.bookLevels}:null},
  {id:'phoenix', tag:'mult', emoji:'🔥', name:'Phoenix', cost:4, desc:'+12 Mult on the first hand of a round.', onHand:c=>c.firstHand?{mult:12}:null},
  {id:'hamster', tag:'mult', emoji:'🐹', name:'Hamster', cost:5, desc:'+4 Mult for every card you keep in hand.', onHand:c=>c.held>0?{mult:4*c.held}:null},
  {id:'kuerbis', tag:'mult', emoji:'🎃', name:'Pumpkin', cost:5, desc:'+15 Mult if you play exactly 3 cards.', onHand:c=>c.cards.length===3?{mult:15}:null},

  /* --- retrigger jokers: a card scores again, and every card joker fires again with it --- */
  {id:'parrot', tag:'retrigger', emoji:'🦜', name:'Parrot', cost:6, desc:'Retriggers the first scoring card.', retrigger:(k,c,i)=>i===0?1:0},
  {id:'mirror', tag:'retrigger', emoji:'🪞', name:'Mirror Pond', cost:5, desc:'Retriggers the last scoring card.', retrigger:(k,c,i,n)=>i===n-1?1:0},
  {id:'echobat', tag:'retrigger', emoji:'🦇', name:'Echo Bat', cost:5, desc:'Retriggers every scoring Stone card.', retrigger:k=>k.mat==='stein'?1:0},
  {id:'forgebell', tag:'retrigger', emoji:'🔔', name:'Forge Bell', cost:5, desc:'Retriggers every scoring Iron card.', retrigger:k=>k.mat==='eisen'?1:0},
  {id:'midas', tag:'retrigger', emoji:'👑', name:'Midas Touch', cost:6, desc:'Retriggers every scoring Gold card.', retrigger:k=>k.mat==='gold'?1:0},
  {id:'gemcutter', tag:'retrigger', emoji:'💠', name:'Gemcutter', cost:6, desc:'Retriggers every scoring Diamond card.', retrigger:k=>k.mat==='diamant'?1:0},
  {id:'lumbermill', tag:'retrigger', emoji:'🪵', name:'Lumber Mill', cost:5, desc:'Retriggers every scoring Wood and Stick card.', retrigger:k=>(k.mat==='holz'||k.mat==='stock')?1:0},

  /* --- growing, lucky and odd jokers --- */
  {id:'snowball', tag:'mult', emoji:'⛄', name:'Snowball Golem', cost:5, desc:'Gains +2 Mult for every round you win (all run).',
    onHand:(c,s)=>s.n>0?{mult:2*s.n}:null, onRoundWin:s=>{ s.n++; }, dyn:s=>'now +' + 2*s.n + ' Mult'},
  {id:'packrat', tag:'chips', emoji:'🐀', name:'Pack Rat', cost:4, desc:'Gains +4 Chips for every discard you use (all run).',
    onHand:(c,s)=>s.n>0?{chips:4*s.n}:null, onDiscard:s=>{ s.n++; }, dyn:s=>'now +' + 4*s.n + ' Chips'},
  {id:'clover', tag:'mult', emoji:'🍀', name:'Lucky Clover', cost:5, desc:'Every scoring card has a 1 in 4 chance of +10 Mult.', onCard:()=>rng()<0.25?{mult:10}:null},
  {id:'dice', tag:'xmult', emoji:'🎲', name:"Gambler's Dice", cost:6, desc:'1 in 5 chance of ×4 Mult on every hand.', onHand:()=>rng()<0.2?{xmult:4}:null},

function idleCalc(){ return {name:'Select cards', emoji:'', type:null, chips:0, mult:0, total:null}; }

  easy:   {name:'Easy',   mult:0.7,  info:'Targets ×0.7 and +1 hand every round.'},

function applyDifficulty(d){
  const m = DIFFS[d].mult, sc = o => { if(!o.base) o.base = o.target; o.target = Math.max(100, Math.round(o.base * m / 50) * 50); };

function sortHand(){
  if(G.sort === 'mat') G.hand.sort((a,b) => MAT_ORDER.indexOf(a.mat) - MAT_ORDER.indexOf(b.mat) || a.id - b.id);
  else G.hand.sort((a,b) => b.chips - a.chips || MAT_ORDER.indexOf(a.mat) - MAT_ORDER.indexOf(b.mat) || a.id - b.id);
}
function drawUp(){
  while(G.hand.length < handSize() && G.draw.length) G.hand.push(G.draw.pop());
  sortHand();
}
function selectedCards(){ return Array.from(G.selected).map(id => G.hand.find(c => c.id === id)).filter(Boolean); }   // in the order you clicked them

  if(G.phase !== 'play') return;
  const sel = selectedCards();
  if(!sel.length){ G.calc = idleCalc(); return; }
  const ev = evaluate(sel, G.handLevels);
  const lv = G.handLevels[ev.type], st = handStats(ev.type, lv);
  G.calc = {name: HANDS[ev.type].name + ' Lv.' + lv, emoji: HANDS[ev.type].emoji, type: ev.type, chips: st.chips, mult: st.mult, total: null};
}

/* =====================================================================
   Scoring
   ===================================================================== */
function scoreHand(cards){
  const ev = evaluate(cards, G.handLevels);
  const lv = G.handLevels[ev.type], def = HANDS[ev.type];
  const st = handStats(ev.type, lv);
  let chips = st.chips, mult = st.mult;
  const steps = [{kind:'base', chips:chips, mult:mult}];
  const debuff = G.boss && G.boss.debuff;
  const held = G.hand.filter(c => cards.indexOf(c) === -1).length;
  const bookLevels = HAND_ORDER.reduce((s, k) => s + (G.handLevels[k] - 1), 0);
  const ctx = {type:ev.type, cards:cards, scoring:ev.scoring, handsLeft:G.handsLeft, discardsLeft:G.discardsLeft, hasPair:ev.hasPair,
    held:held, bookLevels:bookLevels, firstHand:(G.handsTotal - G.handsLeft) === 1, handNo:(G.handsTotal - G.handsLeft), roundNo:G.roundIdx + 1};

  function apply(e, jokerIdx, cardId){
    if(Array.isArray(e)){ e.forEach(x => apply(x, jokerIdx, cardId)); return; }
    const s = {kind:'joker', jokerIdx:jokerIdx, cardId:cardId, dChips:0, dMult:0, xMult:1};
    if(e.note) s.note = e.note;
    if(e.money) s.dMoney = e.money;
    if(e.levelUp) s.levelUp = true;
    if(e.chips){ chips += e.chips; s.dChips = e.chips; }
    if(e.mult){ mult += e.mult; s.dMult = e.mult; }
    if(e.xmult){ mult *= e.xmult; s.xMult = e.xmult; }
    s.chips = chips; s.mult = mult; steps.push(s);
  }

  const scoreList = G.jokers.some(j => j.allCards) ? cards : ev.scoring;   // Echo Crown: every played card scores
  scoreList.forEach((c, ci) => {
    if(c.mat === debuff){
      steps.push({kind:'card', cardId:c.id, debuffed:true, dChips:0, chips:chips, mult:mult});
      return;
    }
    // who retriggers this card?
    const sources = [];
    G.jokers.forEach((j, i) => {
      if(j.retrigger){
        const n = j.retrigger(c, ctx, ci, scoreList.length) || 0;
        for(let k = 0; k < n; k++) sources.push(i);
      }
    });
    for(let rep = 0; rep <= sources.length; rep++){
      if(rep > 0) steps.push({kind:'retrigger', jokerIdx:sources[rep - 1], cardId:c.id, chips:chips, mult:mult});
      chips += c.chips;
      steps.push({kind:'card', cardId:c.id, dChips:c.chips, chips:chips, mult:mult, again:rep > 0});
      G.jokers.forEach((j, i) => {
        if(j.onCard){ const e = j.onCard(c, ctx, j); if(e) apply(e, i, c.id); }
      });
    }
  });
  G.jokers.forEach((j, i) => {
    if(j.onHand){ const e = j.onHand(ctx, j); if(e) apply(e, i, null); }
  });
  return {type:ev.type, name:def.name + ' Lv.' + lv, emoji:def.emoji, steps:steps, chips:chips, mult:mult, total:Math.floor(chips * mult)};
}

let ac = null;
function tone(freq, dur, type, vol){
  if(muted || TEST) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.04, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}

/* =====================================================================
   Ambient music: generated live with the Web Audio API (no files needed)
   ===================================================================== */
const MUSIC_CALM = [ {r:45, n:[57,60,64,67]}, {r:41, n:[57,60,64,65]}, {r:48, n:[55,59,64,67]}, {r:43, n:[55,59,62,64]} ];
const MUSIC_BOSS = [ {r:45, n:[57,60,64]}, {r:41, n:[57,60,65]}, {r:38, n:[57,62,65]}, {r:40, n:[56,59,64]} ];
const MUSIC_PENT = [69,72,74,76,79,81,84];
function createMusic(ctx){
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const master = ctx.createGain(); master.gain.value = 0;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 3; comp.attack.value = .02; comp.release.value = .3;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2800; lp.Q.value = .3;
  const bus = ctx.createGain(), dry = ctx.createGain(), wet = ctx.createGain(), conv = ctx.createConvolver();
  dry.gain.value = .7; wet.gain.value = .6;
  const len = Math.floor(ctx.sampleRate * 3), imp = ctx.createBuffer(2, len, ctx.sampleRate);
  for(let c = 0; c < 2; c++){ const d = imp.getChannelData(c); for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
  conv.buffer = imp;
  bus.connect(dry); dry.connect(lp); bus.connect(conv); conv.connect(wet); wet.connect(lp);
  lp.connect(comp); comp.connect(master); master.connect(ctx.destination);

  function env(g, t, a, peak, hold, r){
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.setValueAtTime(peak, t + a + hold); g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + r);
  }
  function osc(type, f, t, dur, dest, detune){
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; if(detune) o.detune.value = detune;
    o.connect(dest); o.start(t); o.stop(t + dur); return o;
  }
  function pad(m, t, dur, vol, dest){
    const g = ctx.createGain(); g.connect(dest); env(g, t, 2.4, vol, Math.max(0, dur - 2.4), 3.2);
    osc('triangle', hz(m), t, dur + 3.4, g, -7); osc('triangle', hz(m), t, dur + 3.4, g, 7);
  }
  function bell(m, t, vol){
    const g = ctx.createGain(); g.connect(bus); env(g, t, .01, vol, 0, 3.6);
    osc('sine', hz(m), t, 3.8, g); const h = ctx.createGain(); h.gain.value = .22; h.connect(g); osc('sine', hz(m) * 2.01, t, 3.8, h);
  }
  function pluck(m, t, vol){
    const g = ctx.createGain(); g.connect(bus); env(g, t, .005, vol, 0, .6); osc('triangle', hz(m), t, .7, g);
  }
  function low(m, t, dur, vol){
    const g = ctx.createGain(); g.connect(bus); env(g, t, 1.2, vol, Math.max(0, dur - 1.2), 2.2); osc('sine', hz(m - 12), t, dur + 2.4, g);
  }

  let nextT = 0, idx = 0, step = 0;
  const ARP = [0, 1, 2, 3, 2, 1];
  function chord(T, mood){
    const set = mood === 'boss' ? MUSIC_BOSS : MUSIC_CALM, ch = set[idx++ % set.length];
    const D = mood === 'boss' ? 5.5 : mood === 'play' ? 6.5 : 8;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = mood === 'boss' ? 750 : 1250; f.connect(bus);
    ch.n.forEach((m, i) => pad(m, T + i * .12, D, mood === 'boss' ? .05 : .042, f));
    low(ch.r, T, D, mood === 'boss' ? .13 : .1);
    if(mood === 'boss') low(ch.r + 7, T + .1, D, .05);
    if(mood !== 'calm'){
      const st = mood === 'boss' ? .375 : .5;
      for(let t = T + .3; t < T + D - .2; t += st){
        if(Math.random() < .82) pluck(ch.n[ARP[step % ARP.length] % ch.n.length] + 12, t, mood === 'boss' ? .04 : .03);
        step++;
      }
    }
    if(mood !== 'boss'){
      const cnt = mood === 'calm' ? 3 : 1;
      for(let i = 0; i < cnt; i++) bell(MUSIC_PENT[Math.floor(Math.random() * MUSIC_PENT.length)], T + 1 + Math.random() * (D - 2.5), mood === 'calm' ? .04 : .03);
    }
    nextT = T + D - .4;
  }
  return {
    resetClock(now){ nextT = now + .15; },
    schedule(until, mood){ if(!nextT) nextT = ctx.currentTime + .15; let guard = 0; while(nextT < until && guard++ < 20) chord(nextT, mood); },
    setLevel(v, now){ master.gain.cancelScheduledValues(now); master.gain.setValueAtTime(master.gain.value, now); master.gain.linearRampToValueAtTime(v, now + .8); }
  };
}
const music = {
  eng:null, timer:null, level:(() => { const v = parseInt(store.get('blockpoker.music') || '2', 10); return v >= 0 && v <= 2 ? v : 2; })(),
  vol(){ return muted ? 0 : [0, .28, .55][this.level]; },
  mood(){ return (!G || G.phase === 'shop') ? 'calm' : G.bossFight ? 'boss' : 'play'; },
  tick(){ if(ac && this.eng) this.eng.schedule(ac.currentTime + 1.8, this.mood()); },
  start(){
    if(TEST && !params.has('music')) return;
    try{
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if(ac.state === 'suspended') ac.resume();
      if(!this.eng) this.eng = createMusic(ac);
      this.sync();
    }catch(e){}
  },
  sync(){
    if(!this.eng || !ac) return;
    const v = this.vol(); this.eng.setLevel(v, ac.currentTime);
    if(v > 0 && !this.timer){ this.eng.resetClock(ac.currentTime); this.tick(); this.timer = setInterval(() => this.tick(), 400); }
    else if(v === 0 && this.timer){ clearInterval(this.timer); this.timer = null; }
  },
  cycle(){
    this.level = (this.level + 2) % 3; store.set('blockpoker.music', String(this.level));
    if(this.level > 0) this.start(); else this.sync();
    renderMusicBtn(); toast('Music: ' + ['off', 'quiet', 'normal'][this.level], 1200);
  }
};
function renderMusicBtn(){
  const t = 'Music: ' + ['off', 'quiet', 'normal'][music.level] + ' (click to change)';
  ['#bMusic', '#bMusicT'].forEach(id => { const b = $(id); if(!b) return; b.title = t; b.setAttribute('aria-label', t); b.classList.toggle('off', music.level === 0); });
}

function toggleCard(id){
  if(!G || G.phase !== 'play') return;
  if(G.selected.has(id)) G.selected.delete(id);
  else {
    if(G.selected.size >= MAX_SEL){ toast('You can select up to 5 cards.'); sfx.bad(); return; }
    G.selected.add(id);
  }
  sfx.pick();
  if(G.tut) tutCheck();
  render();
}

function discardSelected(){
  if(G && G.tut && G.tut.step < 4){ toast('Discarding comes later. Follow the tip first.'); return; }
  if(!G || G.phase !== 'play') return;
  if(!G.selected.size) return;
  if(G.discardsLeft < 1){ toast('No discards left.'); return; }
  const tossed = G.hand.filter(c => G.selected.has(c.id));
  G.hand = G.hand.filter(c => !G.selected.has(c.id));
  G.selected = new Set();
  G.discardsLeft--;
  G.jokers.forEach(j => { if(j.onDiscard) j.onDiscard(j, tossed); });
  drawUp();
  tone(300, .08, 'square', .04);
  render();
}

const wait = ms => new Promise(r => setTimeout(r, TEST ? 0 : (G && G.fast ? ms / 8 : ms)));

function floatText(el, text, cls){
  if(!el) return;
  const f = document.createElement('span');
  f.className = 'float ' + cls; f.textContent = text;
  el.appendChild(f);
  setTimeout(() => f.remove(), 950);
}
function popEl(el){ if(!el) return; el.classList.remove('score'); void el.offsetWidth; el.classList.add('score'); }
function bumpEl(el){ if(!el) return; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

function updateScoreUi(v){
  const n = $('#scoreNum'), bar = $('#bar'); if(!n) return;
  const t = curRound().target;
  n.textContent = num(Math.floor(v));
  bar.style.width = Math.min(100, v / t * 100) + '%';
}

async function playSelected(){
  if(!G || G.phase !== 'play') return;
  const run = G;
  const sel = selectedCards();
  if(sel.length < 1 || sel.length > MAX_SEL || G.handsLeft < 1) return;
  if(G.tut && G.tut.step < 4){
    if(!tutExact()){ toast('Follow the tip first: 2 Diamonds + 1 Stick.'); sfx.bad(); return; }
    G.tut.step = 99;
  }
  G.phase = 'anim'; G.fast = false;
  G.handsLeft--;
  G.playing = sel.slice();
  G.hand = G.hand.filter(c => !G.selected.has(c.id));
  G.selected = new Set();
  const res = scoreHand(sel);
  G.crafted[res.type] = (G.crafted[res.type] || 0) + 1;
  G.calc = {name:res.name, emoji:res.emoji, type:res.type, chips:res.steps[0].chips, mult:res.steps[0].mult, total:null};
  render();
  const pace = Math.max(0.45, Math.min(1, 16 / res.steps.length));
  await wait(350); if(G !== run) return;
  for(let i = 1; i < res.steps.length; i++){
    const s = res.steps[i];
    G.calc.chips = s.chips; G.calc.mult = s.mult; paintCalc();
    if(s.kind === 'card'){
      const el = $('#bench [data-id="' + s.cardId + '"]');
      popEl(el);
      if(s.debuffed) floatText(el, 'Weak', 'd');
      else { floatText(el, '+' + s.dChips, 'c'); bumpEl($('#cChips')); sfx.step(i); }
    } else if(s.kind === 'retrigger'){
      popEl($('#jokerbar [data-j="' + s.jokerIdx + '"]'));
      floatText($('#jokerbar [data-j="' + s.jokerIdx + '"]'), 'Again!', 'x');
      popEl($('#bench [data-id="' + s.cardId + '"]'));
      sfx.again();
    } else {
      const el = $('#jokerbar [data-j="' + s.jokerIdx + '"]');
      popEl(el);
      if(s.dMoney) G.money += s.dMoney;
      if(s.levelUp) G.handLevels[res.type]++;
      if(s.note && !s.dChips && !s.dMult && s.xMult === 1) floatText(el, s.note, s.note === 'Miss' ? 'd' : 'x');
      else if(s.dChips){ floatText(el, '+' + s.dChips + ' Chips', 'c'); bumpEl($('#cChips')); }
      else if(s.dMult){ floatText(el, '+' + fmt(s.dMult) + ' Mult', 'm'); bumpEl($('#cMult')); }
      else if(s.xMult !== 1){ floatText(el, '×' + fmt(s.xMult), 'x'); bumpEl($('#cMult')); }
      sfx.jok();
    }
    await wait((s.kind === 'card' ? 380 : 480) * pace); if(G !== run) return;
  }
  G.calc.total = res.total; paintCalc();
  await wait(450); if(G !== run) return;
  const from = G.score; G.score += res.total;
  const pm = bonus('playMoney'); if(pm) G.money += pm;
  G.jokers.forEach(j => { if(j.onPlayed){ const m = j.onPlayed(res.type, G.score >= curRound().target); if(m) toast(m); } });
  for(let k = 1; k <= 12; k++){
    G.shownScore = from + (G.score - from) * k / 12;
    updateScoreUi(G.shownScore);
    await wait(35); if(G !== run) return;
  }
  G.shownScore = G.score; updateScoreUi(G.score);
  await wait(450); if(G !== run) return;
  G.playing = [];
  drawUp();
  G.calc = idleCalc();
  afterPlay();
}

function afterPlay(){
  if(G.score >= curRound().target){ roundWon(); return; }
  if(G.handsLeft < 1 || !G.hand.length){ gameOver(); return; }
  G.phase = 'play';
  render();
}

function roundWon(){
  G.phase = 'clear';
  if(G.bossFight){ bossWon(); return; }
  const r = ROUNDS[G.roundIdx];
  const prev = parseInt(store.get(bestKey(G.diff)) || '0', 10) || 0;

    if(G.tut.gift && G.jokers.length < maxJokers()){

    }

  if(G.roundIdx === ROUNDS.length - 1){ victory(); return; }
  const lines = [['Round cleared', r.reward]];
  if(G.handsLeft > 0) lines.push(['Hands left (' + G.handsLeft + ' × 1)', G.handsLeft]);

/* ---------- Market ---------- */
const RARITY_WEIGHT = {common:10, uncommon:9, rare:5, legendary:1.6};
function isHigh(j){ const r = rarityOf(j); return r === 'rare' || r === 'legendary'; }
function genOffers(){
  const owned = new Set(G.jokers.map(j => j.id));
  const bag = JOKERS.filter(j => !owned.has(j.id));
  const n = 3 + bonus('shopSlots');
  const boost = (1 + 0.12 * G.roundIdx) * (1 + 0.6 * (G.pity || 0));   // later rounds and bad luck streaks favour Rare / Legendary
  const w = j => RARITY_WEIGHT[rarityOf(j)] * (isHigh(j) ? boost : 1);
  const picked = [];
  while(picked.length < n && bag.length){
    let x = rng() * bag.reduce((t, j) => t + w(j), 0), k = 0;
    for(; k < bag.length - 1; k++){ x -= w(bag[k]); if(x <= 0) break; }
    picked.push(bag.splice(k, 1)[0]);
  }
  if(!picked.some(isHigh) && (G.pity || 0) >= 2){
    const hi = bag.filter(isHigh);
    if(hi.length) picked[picked.length - 1] = hi[Math.floor(rng() * hi.length)];
  }
  G.pity = picked.some(isHigh) ? 0 : (G.pity || 0) + 1;
  const offers = picked.map(j => ({kind:'joker', id:j.id, sold:false}));
  offers.forEach(o => markFound(o.id));
  ['small', 'grand', 'sword'].forEach(t => {
    const d = PACKS[t];
    if(t !== 'small' && rng() >= d.chance) return;
    const n = Math.min((d.pool || HAND_ORDER).length, d.n + bonus('packOptions'));
    offers.push({kind:'pack', type:t, cost:d.cost, levels:1, options:shuffle((d.pool || HAND_ORDER).slice()).slice(0, n), sold:false});
  });
  return offers;
}
function announceOffers(){
  const r = G.shopOffers.filter(o => o.kind === 'joker' && !o.sold).map(o => rarityOf(JOKER_BY_ID[o.id]));
  if(r.includes('legendary')){ sfx.legend(); }
  else if(r.includes('rare')) sfx.rare();
}
function flash(){ document.body.classList.add('flash'); setTimeout(() => document.body.classList.remove('flash'), 800); }
function enterShop(){
  closeModal();
  G.phase = 'shop'; G.selJoker = null; G.calc = idleCalc();
  if(G.tut) G.tut.step = 4;
  G.shopOffers = genOffers(); G.rerollCost = Math.max(1, 2 - bonus('rerollDiscount')); G.rerollsThisShop = 0;
  render(); announceOffers();
}
function buy(i){
  if(!G || G.phase !== 'shop') return;
  const o = G.shopOffers[i]; if(!o || o.sold) return;
  if(o.kind === 'joker'){
    const j = JOKER_BY_ID[o.id];
    const pc = price(j.cost);
    if(G.money < pc){ toast('Not enough emeralds.'); sfx.bad(); return; }
    if(G.jokers.length >= maxJokers()){ toast('All ' + maxJokers() + ' joker slots are full. Sell a joker first.'); sfx.bad(); return; }
    G.money -= pc; G.jokers.push(makeJoker(j)); o.sold = true; markFound(j.id);
    const rr = rarityOf(j);
    if(rr === 'legendary'){ sfx.legend(); toast('★ Legendary joker acquired: ' + j.name + '!', 2600); render(); return; }
    if(rr === 'rare'){ G.popJ = G.jokers.length - 1; sfx.rare(); toast('Rare joker acquired: ' + j.name + '!', 2200); render(); G.popJ = null; return; }
  } else {
    const pc = packPrice(o);
    if(G.money < pc){ toast('Not enough emeralds.'); sfx.bad(); return; }
    G.pendingPack = i; sfx.pick(); openModal(packHtml(o), true, o.options.length > 3);
    return;
  }
  sfx.buy(); render();
}
function packHtml(o){
  const d = PACKS[o.type], pc = packPrice(o);
  return '<h2>' + d.emoji + ' ' + d.name + ' ' + infoBtn('Pick 1 book. It costs ' + pc + ' emeralds and you only pay when you choose. Each book raises its recipe by ' + o.levels + ' level.') + '</h2>' +
    '<div class="picks">' + o.options.map(h => {
      const hd = HANDS[h], lv = G.handLevels[h], a = handStats(h, lv), n = handStats(h, lv + o.levels);
      return '<button type="button" class="offer pick r-book" data-packpick="' + h + '"><div class="oe">📖</div><b>' + BOOKS[h] + '</b><div class="ot">' + hd.name + '</div>' +
        '<div class="od">Lv.' + lv + ' → ' + (lv + o.levels) + '<br>' + a.chips + '×' + a.mult + ' → ' + n.chips + '×' + n.mult + '</div></button>';
    }).join('') + '</div><div class="mbtns"><button type="button" class="btn" data-act="close">Cancel</button></div>';
}
function choosePack(i, hand){
  if(!G || G.phase !== 'shop') return false;
  const o = G.shopOffers[i]; if(!o || o.kind !== 'pack' || o.sold || o.options.indexOf(hand) === -1) return false;
  const pc = packPrice(o);
  if(G.money < pc){ toast('Not enough emeralds.'); sfx.bad(); return false; }
  G.money -= pc; G.handLevels[hand] += o.levels; o.sold = true; G.pendingPack = null;
  if(G.tut && G.tut.step === 5) G.tut.step = 6;
  closeModal(); sfx.buy(); toast(BOOKS[hand] + ': ' + HANDS[hand].name + ' is now level ' + G.handLevels[hand] + '.', 2200); render();
  return true;
}
function reroll(){
  if(!G || G.phase !== 'shop') return;
  const pc = rerollPrice();
  if(G.money < pc){ toast('Not enough emeralds.'); sfx.bad(); return; }
  G.money -= pc; if(pc > 0) G.rerollCost++;
  G.rerollsThisShop++;
  G.shopOffers = genOffers();
  tone(500,.08,'triangle',.05); render(); announceOffers();
}
function sellJoker(i){
  if(!G || (G.phase !== 'play' && G.phase !== 'shop')) return;
  const j = G.jokers[i]; if(!j) return;
  if(j.slots && G.jokers.length - 1 > maxJokers() - j.slots){ toast('Sell another joker first: without ' + j.name + ' you only have ' + (maxJokers() - j.slots) + ' slots.'); sfx.bad(); return; }
  G.money += sellValue(j);
  G.jokers.splice(i, 1); G.selJoker = null;
  tone(400,.08,'triangle',.05); render();
}
function nextRound(){
  if(!G || G.phase !== 'shop') return;
  startRound(G.roundIdx + 1);
}

    const s = e.target.closest('[data-j]'); if(!s || !G || (G.phase !== 'play' && G.phase !== 'shop')) return;
    const i = parseInt(s.dataset.j, 10);
    G.selJoker = G.selJoker === i ? null : i; renderJokers();
  });
  $('#jinfo').addEventListener('click', e => {
    const m = e.target.closest('[data-move]');
    if(m){ if(G && G.selJoker != null) moveJoker(G.selJoker, G.selJoker + parseInt(m.dataset.move, 10)); return; }
    if(e.target.closest('[data-closeinfo]')){ G.selJoker = null; renderJokers(); return; }
    const s = e.target.closest('[data-sell]'); if(s) sellJoker(parseInt(s.dataset.sell, 10));
  });
  $('#jokerbar').addEventListener('pointerdown', e => {
    const s = e.target.closest('[data-j]');
    if(!s || !G || (G.phase !== 'play' && G.phase !== 'shop')) return;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    const els = jokerSlots();
    drag = { idx: parseInt(s.dataset.j, 10), el: s, x0: e.clientX, y0: e.clientY, moved: false, id: e.pointerId, target: parseInt(s.dataset.j, 10),
             centers: els.map(el => { const b = el.getBoundingClientRect(); return b.left + b.width / 2; }), els: els };
    try{ s.setPointerCapture(e.pointerId); }catch(err){}
  });
  $('#jokerbar').addEventListener('pointermove', e => {
    if(!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if(!drag.moved){
      if(Math.hypot(dx, dy) < 6) return;
      drag.moved = true; drag.el.classList.add('dragging');
    }
    drag.el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    const cx = drag.centers[drag.idx] + dx;
    let best = drag.idx, bd = Infinity;
    for(let i = 0; i < drag.centers.length; i++){
      const dist = Math.abs(cx - drag.centers[i]);
      if(dist < bd){ bd = dist; best = i; }
    }
    best = Math.min(best, G.jokers.length - 1);
    drag.target = best;
    drag.els.forEach((el, i) => el.classList.toggle('dropt', i === best && best !== drag.idx));
  });
  $('#jokerbar').addEventListener('pointerup', endDrag);
  $('#jokerbar').addEventListener('pointercancel', endDrag);
  $('#shopview').addEventListener('click', e => {
    const b = e.target.closest('[data-buy]');
    if(b){ buy(parseInt(b.dataset.buy, 10)); return; }
    if(e.target.closest('#bBoss')){ const bb = bossFor(G.roundIdx); if(bb && !G.bossDone[bb.id]) openModal(bossConfirmHtml(bb), true); return; }
    if(e.target.closest('#bReroll')) reroll();
    else if(e.target.closest('#bNext')) nextRound();
  });
  $('#modal').addEventListener('click', e => {
    const col = e.target.closest('[data-col]');
    if(col){ const w = $('#colwrap'); if(w){ const p = w.parentNode; p.innerHTML = collectionHtml(col.dataset.col); } return; }
    if(e.target.closest('[data-colrev]')){ const w = $('#colwrap'); if(w){ colRev = !colRev; w.parentNode.innerHTML = collectionHtml(colTag); } return; }
    const pp = e.target.closest('[data-packpick]');
    if(pp){ choosePack(G ? G.pendingPack : null, pp.dataset.packpick); return; }
    const pk = e.target.closest('[data-pick]');
    if(pk){
      if(G && G.pendingPick && G.pendingPick.includes(pk.dataset.pick) && G.jokers.length < maxJokers()){
        const d = JOKER_BY_ID[pk.dataset.pick]; G.jokers.push(makeJoker(d)); markFound(d.id);
        G.pendingPick = null; toast('★ Legendary joker acquired: ' + d.name + '!', 2600);
        resumeShop();
      }
      return;
    }
    const a = e.target.closest('[data-act]');
    if(a){
      const act = a.dataset.act;
      if(act === 'close'){ closeModal(); updateRecord(); }
      else if(act === 'shop') enterShop();
      else if(act === 'backshop') resumeShop();
      else if(act === 'fight'){ const bb = BOSSES.find(x => x.id === a.dataset.boss); if(bb && G && G.phase === 'shop' && !G.bossDone[bb.id]){ closeModal(); startRound(G.roundIdx, bb); } else closeModal(); }
      else if(act === 'newrun'){ closeModal(); newRun(); }
      return;
    }
    if(e.target === $('#modal') && $('#modal').dataset.dismiss === '1'){ closeModal(); updateRecord(); }
  });
  document.addEventListener('click', e => { const i = e.target.closest('[data-info]'); if(i) toast(i.dataset.info, 3800); });
  document.addEventListener('pointerdown', () => { if(G && G.phase === 'anim') G.fast = true; });
  const kick = () => { if(music.level > 0 && !music.eng) music.start(); else if(ac && ac.state === 'suspended') ac.resume(); };
  document.addEventListener('pointerdown', kick); document.addEventListener('keydown', kick);
  document.addEventListener('visibilitychange', () => { if(!ac) return; if(document.hidden) ac.suspend(); else ac.resume(); });
  document.addEventListener('keydown', e => {
    if(modalOpen()){
      if(e.key === 'Escape' && $('#modal').dataset.dismiss === '1'){ closeModal(); updateRecord(); }
      return;
    }
    if(G && (G.phase === 'play' || G.phase === 'shop') && !$('#game').hidden && G.selJoker != null && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
      e.preventDefault(); moveJoker(G.selJoker, G.selJoker + (e.key === 'ArrowLeft' ? -1 : 1)); return;
    }
    if(!G || G.phase !== 'play' || $('#game').hidden) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    const ki = /^[1-9]$/.test(e.key) ? parseInt(e.key, 10) - 1 : e.key === '0' ? 9 : e.key === '-' ? 10 : -1;
    if(ki >= 0){ const c = G.hand[ki]; if(c) toggleCard(c.id); }
    else if(e.key === 'Enter'){ e.preventDefault(); playSelected(); }
    else if(e.key === 'd' || e.key === 'D' || e.key === 'Backspace'){ e.preventDefault(); discardSelected(); }
  });
}

window.BP = {
  get G(){ return G; }, evaluate, scoreHand, HANDS, JOKERS, ROUNDS, MATS, makeDeck, handStats, makeJoker, rarityOf,
  newRun, startRound, toggleCard, price, maxJokers, handSize, rerollPrice, bookPrice, packPrice, choosePack, PACKS, SWORD_HANDS, BOSSES, bossFor, resumeShop, sellValue, BOOKS, moveJoker, playSelected, discardSelected, enterShop, buy, reroll, nextRound, sellJoker,
  get found(){ return found; }, music, createMusic, setRng(f){ rng = f; }, seed(n){ rng = mulberry32(n); }
};

init();
})();
</script>
